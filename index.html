<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Essence">
<meta name="theme-color" content="#F2F2F7">
<link rel="apple-touch-icon" href="icono.png">
<title>Essence Studio</title>
<style>
  html, body { margin: 0; height: 100%; background: #F2F2F7; overflow: hidden; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
  <iframe allow="screen-wake-lock; autoplay" src="https://script.google.com/macros/s/AKfycby2Mu2fJ07Cm9dH_xuJ54Sn6n4uyP2vO_t7ZzSXzdU8ueg-VRjRc3DyZtxwDZNSGGti2w/exec"></iframe>

<script>
  // Mantiene la pantalla encendida mientras haya un refrigerio en curso (lo pide la app interna).
  let lock = null, quiere = false;

  async function pantalla(on) {
    try {
      if (on && !lock && 'wakeLock' in navigator) {
        lock = await navigator.wakeLock.request('screen');
        lock.addEventListener('release', () => { lock = null; });
      } else if (!on && lock) {
        await lock.release(); lock = null;
      }
    } catch (e) {}
  }

  window.addEventListener('message', e => {
    let host = '';
    try { host = new URL(e.origin).hostname; } catch (_) {}
    if (!/(^|\.)googleusercontent\.com$/.test(host) && host !== 'script.google.com') return;
    if (e.data && e.data.type === 'essence-wake') { quiere = !!e.data.on; pantalla(quiere); }
  });

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && quiere) pantalla(true);
  });
</script>
</body>
</html>
